name: Build Preview
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: |
          python3 -m pip install PyYAML
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-european fonts-texgyre poppler-utils
          curl -fL --retry 3 -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
      - name: Validate
        run: |
          python3 scripts/validate_project.py
          python3 scripts/project_integrity.py verify
          python3 scripts/validate_references.py
      - name: Build styled book
        run: python3 scripts/build_book.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview-${{ github.sha }}
          path: |
            exports/*.pdf
            exports/*.epub
            exports/SHA256SUMS
          if-no-files-found: error
