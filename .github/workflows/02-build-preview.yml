name: Build Preview
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: python3 scripts/validate_project.py
      - run: echo 'Export aktiveras när kapiteltext, omslagsval och författare är färdiga.'
