name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: |
          python3 -m pip install PyYAML
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-lang-european fonts-texgyre poppler-utils
          curl -fL --retry 3 -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
      - name: Build versioned release
        env:
          BOOK_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate_project.py
          python3 scripts/project_integrity.py verify
          python3 scripts/validate_references.py
          python3 scripts/build_book.py
          mkdir -p dist
          cp exports/*.pdf exports/*.epub exports/SHA256SUMS dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
            dist/*.epub
            dist/SHA256SUMS
          generate_release_notes: true
